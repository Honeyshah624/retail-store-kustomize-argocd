apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retail-store-staging

resources:
  - ../../../base/checkout

images:
  - name: public.ecr.aws/aws-containers/retail-store-sample-checkout
    newName: public.ecr.aws/aws-containers/retail-store-sample-checkout
    newTag: 1.6.2

replicas:
  - name: checkout
    count: 2

labels:
  - pairs:
      environment: staging
    includeSelectors: false