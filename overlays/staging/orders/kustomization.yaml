apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retail-store-staging

resources:
  - ../../../base/orders

images:
  - name: public.ecr.aws/aws-containers/retail-store-sample-orders
    newName: 454143665149.dkr.ecr.ap-south-1.amazonaws.com/retail-store/orders
    newTag: 1.6.2

replicas:
  - name: orders
    count: 2

labels:
  - pairs:
      environment: staging
    includeSelectors: false