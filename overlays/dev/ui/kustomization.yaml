apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retail-store-dev

resources:
  - ../../../base/checkout

images:
  - name: public.ecr.aws/aws-containers/retail-store-sample-checkout
    newName: public.ecr.aws/aws-containers/retail-store-sample-checkout
    newTag: 1.6.2

replicas:
  - name: checkout
    count: 1

labels:
  - pairs:
      environment: dev
    includeSelectors: false