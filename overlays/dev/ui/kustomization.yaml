apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retail-store-dev

resources:
  - ../../../base/ui

patches:
  - path: service-patch.yaml

images:
  - name: public.ecr.aws/aws-containers/retail-store-sample-ui
    newName: 454143665149.dkr.ecr.ap-south-1.amazonaws.com/retail-store/ui
    newTag: 1.6.2

replicas:
  - name: ui
    count: 1

labels:
  - pairs:
      environment: dev
    includeSelectors: false