apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retail-store-prod

resources:
  - ../../../base/ui

patches:
  - path: service-patch.yaml

images:
  - name: public.ecr.aws/aws-containers/retail-store-sample-ui
    newName: public.ecr.aws/aws-containers/retail-store-sample-ui
    newTag: 1.6.2

replicas:
  - name: ui
    count: 3

labels:
  - pairs:
      environment: prod
    includeSelectors: false